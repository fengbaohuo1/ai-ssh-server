server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置
spring:
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://192.0.2.10:13306/ai_ssh?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  config:
    import:
#      - classpath:agent/test-agent.yml
#      - classpath:agent/parallel_research_app.yml
#      - optional:classpath:agent/only-one-agent.yml
      - classpath:agent/ssh-agent.yml

# MyBatis-Plus 配置
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志
logging:
  level:
    root: info
    org.springframework.ai.openai: TRACE
  config: classpath:logback-spring.xml