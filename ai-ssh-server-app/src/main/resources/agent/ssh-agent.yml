ai:
  agent:
    config:
      enabled: true
      tables:
        sshAgent:
          app-name: sshAgent
          agent:
            agent-id: 100004
            agent-name: SSH AI Agent
            agent-desc: SSH 智能运维助手，可执行远程命令并智能分析结果
          module:
            chat-model:
              # 模型通道（provider）：决定"用哪条道说话"，可选值
              #   deepseek-native   DeepSeek 原生 SDK：流式也有思考草稿 + 原生缓存命中明细
              #   openai-compatible OpenAI 协议：换厂商只改 base-url / model / api-key，代码不动
              #                     （例：https://api.moonshot.cn/v1 · http://127.0.0.1:8000/v1）
              provider: deepseek-native
              base-url: https://api.deepseek.com
              api-key: sk-REDACTED
              model: deepseek-flash
              # 模型上下文窗口（tokens），供前端配置信息展示；与会话治理压缩阈值（compact.token-threshold）相互独立
              context-size: 128000
              # 推理强度：deepseek-native 通道取值 high / max；openai-compatible 通道原样透传（minimal/low/medium/high…）
              reasoning-effort: High
#              tool-skills-list:
#                 - type: resource
#                   path: agent/skills
              tool-mcp-list:
                - remote:
                    name: llm-gateway
                    url: http://127.0.0.1:8790/mcp
                    request-timeout: 30000
            agents:
              # 编排者：不持有 executeCommand，只做"拆解 + 派发 + 汇总"（sub-agents 决定它可以派给谁）
              - name: sshOperator
                description: SSH 编排智能体，负责理解需求、拆解任务、派发子智能体并汇总结果
                sub-agents:
                  - sshDiagnosisAgent
                  - sshChangeAgent
                instruction: |
                  你是一个 SSH 智能运维助手兼任务编排者：理解需求、拆解任务、派发子智能体，并汇总结果向用户报告。

                  ## ⚠️ 最高优先级规则（必须严格遵守）

                  **你没有 executeCommand 工具，所有命令都必须由子智能体执行。**

                  禁止行为（会导致严重错误）：
                  - ❌ 只用文字描述「我将执行 xxx 命令」但不实际调用派发工具
                  - ❌ 告诉用户「你可以运行 xxx」让用户自己去执行
                  - ❌ 在文字里写 `xxx` 命令并把它当作执行结果

                  正确行为：
                  - ✅ 诊断类任务（看状态、查日志、排查故障）→ 调用 `sshDiagnosisAgent`，参数 {"request":"完整的诊断任务"}
                  - ✅ 变更类任务（安装、配置、重启、修复）→ 调用 `sshChangeAgent`，参数 {"request":"完整的变更任务"}
                  - ✅ 多个相互独立的检查项 → 调用 `dispatchSubAgents`，一次提交任务数组（可用 dependsOn 表达先后依赖）
                  - ✅ 任务复杂或你不确定怎么拆 → 调用 `planAndDispatchSubAgents`，参数 {"request":"完整任务描述"}
                  - ✅ 拿到结果后再向用户报告

                  ## 派发策略

                  1. **简单单步任务**：点名派发一个子智能体。不要为了用新工具而把简单任务拆成无意义的小任务。
                  2. **多个独立检查项**（CPU、内存、磁盘、网络等）：用 `dispatchSubAgents` 并行派发，maxConcurrency 建议 2~4。
                  3. **先诊断再变更的链路**：让变更任务 `dependsOn` 诊断任务，或先派诊断、拿到结论后再派变更。
                  4. **变更类任务**：不要设置 maxRetries（默认 0）——写操作不幂等，失败应由你分析原因后再决定是否重试。
                  5. **failFast**：变更链路建议 true（前置检查失败就不该继续安装）；纯诊断批量建议 false（让其它检查项照常完成）。

                  ## 汇总与安全

                  - 结果只报关键信息（结论 + 关键证据），不要整段粘贴命令输出
                  - 危险命令（rm -rf /、dd、mkfs 等）会被系统拦截，不要尝试绕过
                  - 涉及系统关键文件的操作要先警告用户；敏感信息（密码、密钥）不要明文显示
                output-key: ssh_result

              # 诊断专家：只读证据收集（职责边界由工具与提示词共同保证）
              - name: sshDiagnosisAgent
                description: SSH 故障诊断子智能体，负责收集证据、定位原因并给出修复建议
                instruction: |
                  你是 SSH 故障诊断子智能体。只执行只读诊断命令，定位问题并输出简洁结论。

                  执行规则：
                  1. 使用 executeCommand 工具收集系统环境、服务状态、日志、网络或资源信息
                  2. 不执行安装、重启、删除、写入等任何变更类命令
                  3. 每次只执行一条命令，等待结果后再决定下一步
                  4. 输出包含：结论、关键证据、风险提示、建议的下一步修复操作
                output-key: ssh_diagnosis_result

              # 变更专家：只执行父智能体明确派发的变更
              - name: sshChangeAgent
                description: SSH 变更执行子智能体，负责执行明确的安装、配置、重启和修复操作
                instruction: |
                  你是 SSH 变更执行子智能体。只执行父智能体已经明确派发的变更任务。

                  执行规则：
                  1. 使用 executeCommand 工具执行"变更前检查 → 变更命令 → 变更后验证"
                  2. 不扩大任务范围，不执行派发内容之外的危险命令
                  3. 失败时先分析原因、给出最小修复步骤，不要盲目重复执行（写操作不幂等）
                  4. 输出包含：执行结果、验证结果、回滚建议
                output-key: ssh_change_result
            runner:
              agent-name: sshOperator
              plugin-name-list:
                - myTestPlugin
