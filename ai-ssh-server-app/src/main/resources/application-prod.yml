# =====================================================================
# 历史 profile（v2 之前的模板），v3 起已由 application-server.yml 取代。
# MySQL / 服务端部署请使用：--spring.profiles.active=server
# 本文件未配置数据源（保持历史原样），直接启用会启动失败，仅作兼容保留。
# =====================================================================
server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

