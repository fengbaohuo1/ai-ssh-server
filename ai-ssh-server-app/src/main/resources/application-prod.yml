# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

# 生产默认开启接口鉴权与凭证加密：启动前必须注入
#   AI_SECURITY_API_TOKEN / AI_SECURITY_CREDENTIAL_KEY
ai:
  security:
    auth-enabled: ${AI_SECURITY_AUTH_ENABLED:true}
